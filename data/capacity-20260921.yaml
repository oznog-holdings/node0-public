# node0 capacity and inventory figures, 20260921.
#
# One file, read by the numbers strip on both sites and the layer figures. The diagram data
# files under data/diagrams/ carry their own labels and are checked against this file by hand
# at each capture; the generator does not read it.
# Every row names its source and its date. Nothing here is a hand count.
#
# Sources:
#   export    the NetBox nightly export of 20260920 18:45, in the private repo; a live
#             pull on 20260921 22:30 was identical in every object count
#   live      a read-only query run from the operator's laptop on 20260921, 22:20 to 22:40 MDT:
#             the hypervisor API, the cluster and pool status, the GPU driver, the NUT server
#             on core1, the metrics API
#   repo      the private repository at the commit of 20260921 (after Bosun's evening commits)
#   asbuilt   carried from the as-built capture of 20260920 where no live query was possible
#             tonight; marked so
#
# Units: storage is stated in both binary (TiB) and decimal (TB) where the two differ by more
# than rounding, because the tools report in binary and the labels on the boxes are decimal.
# The public pages state TiB where the tool reported binary, with the decimal figure in brackets
# once per page (ruling 20260921).

