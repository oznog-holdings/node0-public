title: "The ladder"
desc: "Six rungs. Each is a complete site; the next is taken when the previous one's failure has actually bitten. After rung 3 the ladder branches."
kind: flow
columns:
  - name: "rung 0"
    nodes: [{id: r0, label: "the laptop", sub: "backups already running to a bucket; cost 0"}]
  - name: "rung 1"
    nodes: [{id: r1, label: "the infrastructure box", sub: "all-flash Unraid, ZFS pools, DNS and time, the gateway, a UPS; 1,580 to 2,580"}]
  - name: "rung 2"
    nodes: [{id: r2, label: "the agent box", sub: "NixOS from the repo; resolves names without infra; 150 to 1,290"}]
  - name: "rung 3"
    nodes: [{id: r3, label: "the core box", sub: "DNS and NTP primary, notifications, the restore rehearsal; 150 to 220"}]
  - name: "branches"
    nodes:
      - {id: r4, label: "rung 4: compute", sub: "one more backend behind the gateway; 1,830 to 5,000"}
      - {id: r5, label: "rung 5: the edge and the second site", sub: "a real router, a replica off the property; 600 to 3,580"}
edges:
  - {from: r0, to: r1, label: "laptop closes"}
  - {from: r1, to: r2, label: "infra outage"}
  - {from: r2, to: r3, label: "names still on infra"}
  - {from: r3, to: r4, style: dashed}
  - {from: r3, to: r5, style: dashed}
notes:
  - "Rungs 0 to 3 order by failure mode. Rungs 4 and 5 are independent: take the edge before compute, the second site before either, or neither for a long time."
  - "Through rung 3: 1,880 lean, 4,090 full. Through rung 5: 4,310 lean, 12,670 full. US prices checked 20260920."
