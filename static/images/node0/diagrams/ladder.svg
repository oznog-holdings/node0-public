<text x="522" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">rung 3</text>
<line x1="522" y1="40" x2="626" y2="40" stroke="#2A2A2A"/>
<text x="690" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">branches</text>
<line x1="690" y1="40" x2="794" y2="40" stroke="#2A2A2A"/>
<text x="858" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">rung 6</text>
