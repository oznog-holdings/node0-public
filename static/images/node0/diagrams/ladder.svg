<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 514" width="100%" role="img" aria-labelledby="flow-ladder-t flow-ladder-d" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif">
<title id="flow-ladder-t">The ladder</title><desc id="flow-ladder-d">Seven rungs, 0 to 6. Each is a complete site; the next is taken when the previous one&#x27;s failure has bitten. After rung 3 the ladder branches, and rung 6 follows rung 5.</desc>
