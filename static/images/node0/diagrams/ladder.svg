<path d="M290,150.5 C322.0,150.5 322.0,143.0 354,143.0" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-ladder-a)" opacity="0.9"/>
<path d="M458,143.0 C490.0,143.0 490.0,103.5 522,103.5" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-ladder-a)" opacity="0.9"/>
<path d="M626,103.5 C658.0,103.5 658.0,127.0 690,127.0" fill="none" stroke="#918E88" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flow-ladder-a)" opacity="0.9"/>
<path d="M626,103.5 C658.0,103.5 658.0,295.0 690,295.0" fill="none" stroke="#918E88" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flow-ladder-a)" opacity="0.9"/>
