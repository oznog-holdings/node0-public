<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="100%" role="img" aria-labelledby="flow-alerts-t flow-alerts-d" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif">
<title id="flow-alerts-t">The alert path</title><desc id="flow-alerts-d">A page travels through a machine that is not the one being watched, on a different power feed; a dead-man proves the path by going quiet; an outside vantage point notices when the whole site does.</desc>
<defs><marker id="flow-alerts-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#918E88"/></marker><marker id="flow-alerts-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#EA7170"/></marker></defs>
<rect width="980" height="420" fill="#0D0D0D"/>
<text x="18" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">watched</text>
<line x1="18" y1="40" x2="155" y2="40" stroke="#2A2A2A"/>
<text x="219" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">the stack, on unraid1</text>
<line x1="219" y1="40" x2="356" y2="40" stroke="#2A2A2A"/>
<text x="420" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">the paging path, on core2</text>
<line x1="420" y1="40" x2="557" y2="40" stroke="#2A2A2A"/>
<text x="621" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">who hears it</text>
<line x1="621" y1="40" x2="758" y2="40" stroke="#2A2A2A"/>
<text x="822" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">outside</text>
<line x1="822" y1="40" x2="959" y2="40" stroke="#2A2A2A"/>
<path d="M155,113.0 C187.0,113.0 187.0,96.0 219,96.0" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-alerts-a)" opacity="0.9"/>
<path d="M287.5,136 L287.5,162" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-alerts-a)" opacity="0.9"/>
<path d="M356,202.0 C388.0,202.0 388.0,111.0 420,111.0" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-alerts-a)" opacity="0.9"/>
<path d="M356,202.0 C388.0,202.0 388.0,247.0 420,247.0" fill="none" stroke="#918E88" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flow-alerts-a)" opacity="0.9"/>
<path d="M557,111.0 C589.0,111.0 589.0,96.0 621,96.0" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-alerts-a)" opacity="0.9"/>
<path d="M557,111.0 C589.0,111.0 589.0,209.5 621,209.5" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-alerts-a)" opacity="0.9"/>
<path d="M557,247.0 C589.0,247.0 589.0,96.0 621,96.0" fill="none" stroke="#918E88" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flow-alerts-a)" opacity="0.9"/>
<path d="M822,103.5 C790.0,103.5 790.0,96.0 758,96.0" fill="none" stroke="#918E88" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flow-alerts-a)" opacity="0.9"/>
<rect x="18" y="56" width="137" height="114" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="28" y="75" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">every host,</text>
<text x="28" y="92" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">switch, UPS,</text>
<text x="28" y="109" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">strip, sensor</text>
<text x="28" y="126" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">296 targets,</text>
<text x="28" y="141" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">discovered from the</text>
<text x="28" y="156" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">inventory</text>
<rect x="219" y="56" width="137" height="80" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="229" y="75" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">Prometheus</text>
<text x="229" y="92" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">357 alerting rules;</text>
<text x="229" y="107" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">each names its</text>
<text x="229" y="122" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">runbook and who acts</text>
<rect x="219" y="162" width="137" height="80" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="229" y="181" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">Alertmanager</text>
<text x="229" y="198" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">routes by severity; a</text>
<text x="229" y="213" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">permanent heartbeat</text>
<text x="229" y="228" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">alert</text>
<rect x="420" y="56" width="137" height="110" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="430" y="75" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">ntfy on core2</text>
<text x="430" y="92" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">its own public</text>
<text x="430" y="107" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">address; per-host</text>
<text x="430" y="122" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">write-only tokens;</text>
<text x="430" y="137" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">different box,</text>
<text x="430" y="152" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">different feed</text>
<rect x="420" y="192" width="137" height="110" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="430" y="211" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">dead-man on core2</text>
<text x="430" y="228" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">pages if the</text>
<text x="430" y="243" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">heartbeat stops;</text>
<text x="430" y="258" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">proven by stopping</text>
<text x="430" y="273" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">the stack and timing</text>
<text x="430" y="288" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">it</text>
<rect x="621" y="56" width="137" height="80" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="631" y="75" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">Christoph&#x27;s phone</text>
<text x="631" y="92" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">critical pages;</text>
<text x="631" y="107" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">warnings in the</text>
<text x="631" y="122" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">morning</text>
<rect x="621" y="162" width="137" height="95" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="631" y="181" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">Bosun on agent6</text>
<text x="631" y="198" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">reads every</text>
<text x="631" y="213" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">notification; acts</text>
<text x="631" y="228" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">within its written</text>
<text x="631" y="243" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">permissions</text>
<rect x="822" y="56" width="137" height="95" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="832" y="75" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">outpost1, abroad</text>
<text x="832" y="92" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">no node0 credential;</text>
<text x="832" y="107" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">scans the public</text>
<text x="832" y="122" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">surface; mails out if</text>
<text x="832" y="137" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">core2 goes dark</text>
<rect x="224.99999999999997" y="245" width="63.800000000000004" height="14" fill="#0D0D0D" opacity="0.92"/>
<text x="256.9" y="256" font-size="10" fill="#A8A5A0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">heartbeat</text>
<line x1="18" y1="336" x2="962" y2="336" stroke="#2A2A2A"/>
<text x="18" y="354" font-size="11" fill="#A8A5A0" font-weight="400" text-anchor="start">An alarm that runs through the machine it watches is not an alarm. The stack lives on the storage hub; the page never does.</text>
<text x="18" y="384" font-size="11" fill="#A8A5A0" font-weight="400" text-anchor="start">Probes inside the fabric and a canary at the second site record what the network did, so a quiet dashboard can be told from a broken one.</text>
<text x="962" y="414" font-size="10" fill="#918E88" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">Generated from data/diagrams/alerts.yaml.</text>
</svg>
