<path d="M616.0,121 L616.0,329" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<path d="M616.0,212 L616.0,329" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<path d="M868.0,136 L868.0,162" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<path d="M616.0,238 L616.0,121" fill="none" stroke="#918E88" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<path d="M710,270.5 C742.0,270.5 742.0,96.0 774,96.0" fill="none" stroke="#918E88" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<path d="M206,270.5 C238.0,270.5 238.0,172.0 270,172.0" fill="none" stroke="#918E88" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<rect x="18" y="56" width="188" height="65" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="28" y="75" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">the fibre</text>
<text x="28" y="92" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">one provider, one circuit, 10</text>
<text x="28" y="107" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">Gbps hand-off</text>
<rect x="18" y="147" width="188" height="65" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="28" y="166" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">remote access</text>
<text x="28" y="183" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">a self-hosted mesh,</text>
<text x="28" y="198" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">terminated on both firewalls</text>
<rect x="18" y="238" width="188" height="65" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="28" y="257" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">outpost1</text>
<text x="28" y="274" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">outside-in vantage point,</text>
<text x="28" y="289" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">abroad</text>
<rect x="270" y="56" width="188" height="50" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="280" y="75" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">sw-wan1</text>
<text x="280" y="92" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">the provider hand-off</text>
<rect x="270" y="132" width="188" height="80" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="280" y="151" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">fw1 and fw2</text>
<text x="280" y="168" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">OPNsense, active and passive;</text>
<text x="280" y="183" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">nine CARP groups; all routing</text>
<text x="280" y="198" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">to the fabric</text>
<rect x="270" y="238" width="188" height="65" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="280" y="257" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">sw-lan1, nexus, ntp1</text>
<text x="280" y="274" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">the home side, the replica,</text>
<text x="280" y="289" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">the GPS clock</text>
<rect x="522" y="56" width="188" height="65" fill="rgba(162,47,46,.18)" stroke="#A22F2E" stroke-width="1"/>
<text x="532" y="75" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">Pair A: sw-fa1, sw-fa2</text>
<text x="532" y="92" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">the only pair that routes;</text>
<text x="532" y="107" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">VARP gateways for the VLANs</text>
<rect x="522" y="147" width="188" height="65" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="532" y="166" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">Pair C: sw-cb1, sw-cb2</text>
<text x="532" y="183" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">Ceph back end; jumbo frames;</text>
<text x="532" y="198" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">no gateway</text>
<rect x="522" y="238" width="188" height="65" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="532" y="257" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">sw-mgmt1</text>
<text x="532" y="274" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">management and out-of-band;</text>
<text x="532" y="289" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">dual-homed to A and B</text>
<rect x="522" y="329" width="188" height="95" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="532" y="348" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">rack 2 hosts</text>
<text x="532" y="365" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">prox1 to prox4, ceph1 to</text>
<text x="532" y="380" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">ceph9, unraid1, dev1 to dev4,</text>
<text x="532" y="395" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">core1, core2, the probes, the</text>
<text x="532" y="410" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">Pi shelves</text>
<rect x="774" y="56" width="188" height="80" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="784" y="75" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">Pair B: sw-fb1, sw-fb2</text>
<text x="784" y="92" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">layer 2 only; 160 Gbps port-</text>
<text x="784" y="107" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">channel to Pair A (four 40</text>
<text x="784" y="122" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">Gbps links)</text>
<rect x="774" y="162" width="188" height="95" fill="#181818" stroke="#2A2A2A" stroke-width="1"/>
<text x="784" y="181" font-size="13" fill="#ECEAE6" font-weight="600" text-anchor="start">rack 3 hosts</text>
<text x="784" y="198" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">di1 to di5, util1, util2,</text>
<text x="784" y="213" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">agent1 to agent5, sandbox1,</text>
<text x="784" y="228" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">sandbox2, the serving</text>
<text x="784" y="243" font-size="11" fill="#918E88" font-weight="400" text-anchor="start">laptops, the ClusterHAT</text>
<rect x="470.5" y="115.25" width="39.0" height="14" fill="#0D0D0D" opacity="0.92"/>
<text x="490.0" y="126.25" font-size="10" fill="#A8A5A0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">trunk</text>
<rect x="713.2" y="77.25" width="57.6" height="14" fill="#0D0D0D" opacity="0.92"/>
<text x="742.0" y="88.25" font-size="10" fill="#A8A5A0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">160 Gbps</text>
<rect x="528.0" y="124" width="113.4" height="14" fill="#0D0D0D" opacity="0.92"/>
<text x="584.7" y="135" font-size="10" fill="#A8A5A0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">one bond per host</text>
<rect x="528.0" y="215" width="101.0" height="14" fill="#0D0D0D" opacity="0.92"/>
<text x="578.5" y="226" font-size="10" fill="#A8A5A0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">Ceph hosts only</text>
<rect x="780.0" y="139" width="113.4" height="14" fill="#0D0D0D" opacity="0.92"/>
<text x="836.7" y="150" font-size="10" fill="#A8A5A0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">one bond per host</text>
<rect x="24.000000000000007" y="306" width="119.60000000000001" height="14" fill="#0D0D0D" opacity="0.92"/>
<text x="83.80000000000001" y="317" font-size="10" fill="#A8A5A0" font-weight="400" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">scans from outside</text>
<line x1="18" y1="458" x2="962" y2="458" stroke="#2A2A2A"/>
<text x="18" y="476" font-size="11" fill="#A8A5A0" font-weight="400" text-anchor="start">A host bonds to one pair, never across pairs; pairs sit inside a rack, never across racks. Losing Pair A takes the routing plane, accepted in writing.</text>
<text x="18" y="506" font-size="11" fill="#A8A5A0" font-weight="400" text-anchor="start">The studio, the lab bench and the two Pi shelves hang off Pair A through small switches of their own. No addresses or VLAN numbers are drawn; the fabric</text>
<text x="18" y="521" font-size="11" fill="#A8A5A0" font-weight="400" text-anchor="start">page says why.</text>
<text x="962" y="551" font-size="10" fill="#918E88" font-weight="400" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">Generated from data/diagrams/topology.yaml.</text>
</svg>
