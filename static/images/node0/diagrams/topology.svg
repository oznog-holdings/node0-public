<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 557" width="100%" role="img" aria-labelledby="flow-topology-t flow-topology-d" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif">
<title id="flow-topology-t">Topology: one fibre, a firewall pair, three switch pairs</title><desc id="flow-topology-d">The fibre lands in the network room and ends at a firewall pair; every host bonds to one MLAG pair inside its own rack; the Ceph back end has a pair of its own; one management switch reaches everything and is dual-homed on purpose.</desc>
<defs><marker id="flow-topology-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#918E88"/></marker><marker id="flow-topology-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#EA7170"/></marker></defs>
<rect width="980" height="557" fill="#0D0D0D"/>
<text x="18" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">outside</text>
<line x1="18" y1="40" x2="206" y2="40" stroke="#2A2A2A"/>
<text x="270" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">network room, rack 0</text>
<line x1="270" y1="40" x2="458" y2="40" stroke="#2A2A2A"/>
<text x="522" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">server room, rack 2</text>
<line x1="522" y1="40" x2="710" y2="40" stroke="#2A2A2A"/>
<text x="774" y="34" font-size="11" fill="#EA7170" font-weight="400" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace">server room, rack 3</text>
<line x1="774" y1="40" x2="962" y2="40" stroke="#2A2A2A"/>
<path d="M206,88.5 C238.0,88.5 238.0,81.0 270,81.0" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<path d="M364.0,106 L364.0,132" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<path d="M206,179.5 C238.0,179.5 238.0,172.0 270,172.0" fill="none" stroke="#918E88" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<path d="M458,172.0 C490.0,172.0 490.0,88.5 522,88.5" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-topology-a)" opacity="0.9"/>
<path d="M364.0,212 L364.0,238" fill="none" stroke="#918E88" stroke-width="1.2" marker-end="url(#flow-topology-a)" opacity="0.9"/>
