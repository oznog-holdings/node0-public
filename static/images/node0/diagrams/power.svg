<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 513" width="100%" role="img" aria-labelledby="flow-power-t flow-power-d" font-family="'Space Grotesk', system-ui, -apple-system, sans-serif">
<title id="flow-power-t">Power: one panel, seven UPS units, nine transfer switches</title><desc id="flow-power-d">Six 240 V feeds leave one panel; four UPS units in rack 1 feed racks 2 and 3 as A and B sides through metered strips and transfer switches; three small UPS units carry the network room. Figures are UPS output on 20260921.</desc>
